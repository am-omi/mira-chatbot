<!-- Mira Chatbot made by A. M. Omi -->
<div id="chat-button">💬</div>

<!-- Chat Popup -->
<div id="chat-popup">
  <div id="chat-header">
    <span>Live Chat • MOASS</span>
    <span id="close-chat">✖</span>
  </div>

  <iframe
    src="https://www.chatbase.co/chatbot-iframe/r2Lmo6bE0vYlmVAP38-1p"
    frameborder="0">
  </iframe>
</div>

<style>
/* Floating Bubble Button */
#chat-button {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 55px;
  height: 55px;
  background: black;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  z-index: 9999;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
}

#chat-button:hover {
  transform: scale(1.1);
}

/* Chat Popup (Desktop default) */
#chat-popup {
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 360px;
  height: 520px;
  background: white;
  border-radius: 15px;
  display: none;
  flex-direction: column;
  overflow: hidden;
  z-index: 9999;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  animation: slideUp 0.3s ease;
}

/* Header */
#chat-header {
  background: black;
  color: white;
  padding: 12px;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Close Button */
#close-chat {
  cursor: pointer;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

/* iframe */
#chat-popup iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* 🔥 MOBILE FULL SCREEN MODE */
@media (max-width: 768px) {
  #chat-popup {
    width: 100%;
    height: 85%;
    bottom: 0;
    right: 0;
    border-radius: 20px 20px 0 0;
  }

  #chat-button {
    bottom: 80px; /* avoid navbar overlap */
  }
}

/* Animation */
@keyframes slideUp {
  from {
    transform: translateY(60px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}
</style>

<script>
const chatBtn = document.getElementById("chat-button");
const chatPopup = document.getElementById("chat-popup");
const closeChat = document.getElementById("close-chat");

// Toggle open
chatBtn.onclick = () => {
  chatPopup.style.display = "flex";
};

// Close
closeChat.onclick = () => {
  chatPopup.style.display = "none";
};

// Optional: click outside to close (premium feel)
window.onclick = function(e) {
  if (e.target === chatPopup) {
    chatPopup.style.display = "none";
  }
};
</script>

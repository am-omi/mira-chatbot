<!-- Mira Chat Button -->
<div id="mira-btn">💬</div>

<!-- Popup -->
<div id="mira-popup">
  
  <div id="mira-header">
    <span>Mira • MOASS</span>
    <span id="mira-close">✖</span>
  </div>

  <iframe src="https://mira-chatbot-nl9c.onrender.com"></iframe>

</div>

<style>
/* Button */
#mira-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 55px;
  height: 55px;
  background: #25d366;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  z-index: 999999;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* Popup */
#mira-popup {
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 360px;
  height: 520px;
  background: white;
  border-radius: 15px;
  display: none;
  flex-direction: column;
  overflow: hidden;
  z-index: 999999;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  animation: slideUp 0.25s ease;
}

/* Header */
#mira-header {
  background: #075e54;
  color: white;
  padding: 12px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Close button */
#mira-close {
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
}

/* iframe */
#mira-popup iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* Mobile Responsive */
@media (max-width: 768px) {
  #mira-popup {
    width: 100%;
    height: 90%;
    right: 0;
    bottom: 0;
    border-radius: 20px 20px 0 0;
  }

  #mira-btn {
    bottom: 80px;
  }
}

/* Animation */
@keyframes slideUp {
  from {
    transform: translateY(50px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}
</style>

<script>
const btn = document.getElementById("mira-btn");
const popup = document.getElementById("mira-popup");
const closeBtn = document.getElementById("mira-close");

// Open popup
btn.onclick = () => {
  popup.style.display = "flex";
};

// Close popup
closeBtn.onclick = () => {
  popup.style.display = "none";
};
</script>

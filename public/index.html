<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mira • MOASS Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
    }

    /* Full Chat Container */
    #chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    #chat-header {
      background: black;
      color: white;
      padding: 12px;
      font-weight: bold;
    }

    /* Messages */
    #chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
      background: #f5f5f5;
    }

    .message {
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .user {
      text-align: right;
      color: black;
    }

    .bot {
      text-align: left;
      color: #444;
    }

    /* Input */
    #chat-input {
      display: flex;
      border-top: 1px solid #ddd;
    }

    #chat-input input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
    }

    #chat-input button {
      background: black;
      color: white;
      border: none;
      padding: 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="chat-container">

  <div id="chat-header">
    Chat with Mira • MOASS
  </div>

  <div id="chat-box"></div>

  <div id="chat-input">
    <input id="input" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>
const input = document.getElementById("input");
const chatBox = document.getElementById("chat-box");

// Send message
async function sendMessage() {
  const message = input.value.trim();
  if (!message) return;

  chatBox.innerHTML += `<div class="message user"><b>You:</b> ${message}</div>`;
  input.value = "";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await res.json();

    chatBox.innerHTML += `<div class="message bot"><b>Mira:</b> ${data.reply}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

  } catch (err) {
    chatBox.innerHTML += `<div class="message bot">⚠️ Error connecting to server</div>`;
  }
}

// Enter key support
input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mira • MOASS</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #f5f5f5;
}

/* Container */
#chat {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* Header */
#header {
  background: #000;
  color: #fff;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

#header span {
  font-weight: bold;
}

/* Messages */
#messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

/* Bot bubble */
.bot {
  background: #fff;
  color: #000;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 10px;
  max-width: 75%;
}

/* User bubble */
.user {
  background: #000;
  color: #fff;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 10px;
  max-width: 75%;
  margin-left: auto;
}

/* Suggestions */
.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.suggestions button {
  background: #000;
  color: #fff;
  border: none;
  padding: 6px 10px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 12px;
}

/* Input */
#input-area {
  display: flex;
  padding: 10px;
  background: #fff;
  border-top: 1px solid #ddd;
}

#input {
  flex: 1;
  padding: 10px;
  border-radius: 20px;
  border: 1px solid #ccc;
  outline: none;
}

#send {
  margin-left: 8px;
  background: #000;
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 40px;
  cursor: pointer;
}

/* Mobile */
@media (max-width: 768px) {
  .bot, .user {
    max-width: 85%;
  }
}
</style>
</head>

<body>

<div id="chat">

  <!-- Header -->
  <div id="header">
    🤖 <span>Mira • MOASS</span>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div class="bot">Hi there 👋<br>How can I help you today?</div>

    <div class="suggestions">
      <button onclick="quickMsg('Show me shirts')">Shirts</button>
      <button onclick="quickMsg('Panjabi collection')">Panjabi</button>
      <button onclick="quickMsg('Latest arrivals')">New Arrivals</button>
    </div>
  </div>

  <!-- Input -->
  <div id="input-area">
    <input id="input" placeholder="Write your message..." />
    <button id="send" onclick="sendMessage()">➤</button>
  </div>

</div>

<script>
const input = document.getElementById("input");
const messages = document.getElementById("messages");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = type;
  div.innerHTML = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function quickMsg(text) {
  input.value = text;
  sendMessage();
}

async function sendMessage() {
  const msg = input.value.trim();
  if (!msg) return;

  addMessage(msg, "user");
  input.value = "";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: msg })
    });

    const data = await res.json();
    addMessage(data.reply, "bot");

  } catch {
    addMessage("⚠️ Server error", "bot");
  }
}

input.addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>

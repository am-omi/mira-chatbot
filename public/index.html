<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mira • MOASS Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* Floating Button */
    #chat-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 55px;
      height: 55px;
      background: black;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    /* Chat Popup (Desktop) */
    #chat-popup {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 360px;
      height: 520px;
      background: white;
      border-radius: 15px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* Mobile Full Screen */
    @media (max-width: 768px) {
      #chat-popup {
        width: 100%;
        height: 85%;
        bottom: 0;
        right: 0;
        border-radius: 20px 20px 0 0;
      }
    }

    /* Header */
    #chat-header {
      background: black;
      color: white;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    #close-chat {
      cursor: pointer;
      font-size: 16px;
    }

    /* Chat Messages */
    #chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
    }

    .message {
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .user {
      text-align: right;
      color: black;
    }

    .bot {
      text-align: left;
      color: #444;
    }

    /* Input Area */
    #chat-input {
      display: flex;
      border-top: 1px solid #ddd;
    }

    #chat-input input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
    }

    #chat-input button {
      background: black;
      color: white;
      border: none;
      padding: 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- Floating Chat Button -->
<div id="chat-button">💬</div>

<!-- Chat Popup -->
<div id="chat-popup">

  <div id="chat-header">
    <span>Live Chat • MOASS</span>
    <span id="close-chat">✖</span>
  </div>

  <div id="chat-box"></div>

  <div id="chat-input">
    <input id="input" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>
const chatBtn = document.getElementById("chat-button");
const chatPopup = document.getElementById("chat-popup");
const closeBtn = document.getElementById("close-chat");
const input = document.getElementById("input");
const chatBox = document.getElementById("chat-box");

// Open chat
chatBtn.onclick = () => {
  chatPopup.style.display = "flex";
};

// Close chat
closeBtn.onclick = () => {
  chatPopup.style.display = "none";
};

// Send message
async function sendMessage() {
  const message = input.value;

  if (!message) return;

  chatBox.innerHTML += `<div class="message user"><b>You:</b> ${message}</div>`;
  input.value = "";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message })
    });

    const data = await res.json();

    chatBox.innerHTML += `<div class="message bot"><b>Mira:</b> ${data.reply}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

  } catch (err) {
    chatBox.innerHTML += `<div class="message bot">Error connecting to server</div>`;
  }
}

// Enter key support
input.addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
